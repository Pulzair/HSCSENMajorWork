{% extends "base.html" %}

{% block title %}Register - Battley{% endblock %}

{% block content %}
<section class="auth">
    <h2>Create an account</h2>
    <form method="post" action="{{ url_for('auth.register') }}" novalidate>
        <div class="form-field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   value="{{ request.form.get('username', '') }}"
                   minlength="3" maxlength="32" required>
            <p class="form-hint">3-32 characters: letters, numbers and underscores.</p>
        </div>
        <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   value="{{ request.form.get('email', '') }}"
                   maxlength="254" required>
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   minlength="8" required>
            <p class="form-hint">At least 8 characters.</p>
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
    <p class="auth__alt">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
</section>
{% endblock %}
